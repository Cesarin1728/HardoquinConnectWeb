services:

  blue:
    build:
      context: ..
      dockerfile: blue-green/blue/Dockerfile
    container_name: hardoquin_blue
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL con la cadena de conexion de Supabase en blue-green/.env}
      JWT_SECRET: ${JWT_SECRET:-hardoquin_jwt_dev_secret}
      PORT: 3001
      APP_VERSION: "1.0.0"
      APP_ENV: blue
    networks:
      - hardoquin_net
    restart: unless-stopped

  green:
    build:
      context: ..
      dockerfile: blue-green/green/Dockerfile
    container_name: hardoquin_green
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL con la cadena de conexion de Supabase en blue-green/.env}
      JWT_SECRET: ${JWT_SECRET:-hardoquin_jwt_dev_secret}
      PORT: 3002
      APP_VERSION: "2.0.0"
      APP_ENV: green
    networks:
      - hardoquin_net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    container_name: hardoquin_nginx
    ports:
      - "8088:80"
    depends_on:
      - blue
      - green
    networks:
      - hardoquin_net
    restart: unless-stopped

networks:
  hardoquin_net:
    driver: bridge
