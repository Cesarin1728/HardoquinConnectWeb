worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout 65;

    resolver 127.0.0.11 ipv6=off valid=10s;

    map $cookie_hardoquin_version $hardoquin_backend {
        default blue:3001;
        blue    blue:3001;
        green   green:3002;
    }

    map $cookie_hardoquin_version $active_env {
        default "blue";
        blue    "blue";
        green   "green";
    }

    map $cookie_hardoquin_version $active_version {
        default "1.0.0";
        blue    "1.0.0";
        green   "2.0.0";
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Active-Env $active_env always;
        add_header X-App-Version $active_version always;

        location / {
            proxy_pass         http://$hardoquin_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "active=$active_env version=$active_version\n";
        }
    }
}
