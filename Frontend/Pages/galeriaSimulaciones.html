<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Simulaciones</title>
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/components.css">
    <link rel="stylesheet" href="../CSS/galeriaSimulaciones.css">
</head>
<body>
    <header class="header">
        <section id="main__navbar">

        </section>
    </header>
    <main class="gallery">
        <div class="gallery__inner">
            <section class="gallery__intro">
                <header class="section-header">
                    <strong class="section-header__intro">VER TUS SIMULACIONES</strong>
                    <h2 class="section-header__title">Galería de <span>simulaciones</span></h2>
                    <p class="section-header__description">Tus proyectos guardados — pasa el cursor para ver el escenario sin Hardoquin</p>
                    <form class="gallery__search" role="search" aria-label="Buscar simulación">
                        <span class="gallery__search-icon" data-lucide="search"></span>
                        <input class="gallery__search-input" type="search" placeholder="Buscar simulación..." />
                        <button class="gallery__search-clear" type="reset" aria-label="Limpiar búsqueda">
                            <i data-lucide="x"></i>
                        </button>
                    </form>
                </header>
            </section>
            <section class="gallery__grid" id="gallery-grid" aria-label="Simulaciones guardadas"></section>
        </div>
    </main>
    <dialog class="delete-simulation-modal" id="delete-simulation-modal" aria-labelledby="delete-simulation-title">
        <article class="delete-simulation-modal__panel">
            <header class="delete-simulation-modal__header">
                <h2 class="delete-simulation-modal__title" id="delete-simulation-title">Eliminar simulación</h2>
                <button class="delete-simulation-modal__close" type="button" data-close-delete-simulation aria-label="Cerrar">
                    <i data-lucide="x"></i>
                </button>
            </header>
            <p class="delete-simulation-modal__text" id="delete-simulation-message">Esta simulación se eliminará permanentemente.</p>
            <p class="delete-simulation-modal__feedback" id="delete-simulation-feedback" role="status"></p>
            <footer class="delete-simulation-modal__actions">
                <button class="delete-simulation-modal__cancel" type="button" data-close-delete-simulation>Cancelar</button>
                <button class="delete-simulation-modal__submit" type="button" id="confirm-delete-simulation">Eliminar</button>
            </footer>
        </article>
    </dialog>
    <footer id="main__footer" class="footer"></footer>
    <script src="https://unpkg.com/lucide@0.555.0"></script>
    <script type="module" src="../Js/main-galeriaSimulacion.js"></script>
</body>
</html>
